name: Daily Post Generator

on:
  schedule:
    # 毎朝7時（JST）= 22:00 UTC
    - cron: "0 22 * * *"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      paused: ${{ steps.flag.outputs.paused }}
    steps:
      - uses: actions/checkout@v4
      - id: flag
        name: 一時停止スイッチの確認
        run: |
          if [ -f .paused-generate ]; then
            echo "paused=true" >> "$GITHUB_OUTPUT"
            echo "::notice::現在停止中です。再開するには Actions →「一時停止スイッチ」→ 再開する を実行してください"
          else
            echo "paused=false" >> "$GITHUB_OUTPUT"
          fi

  generate:
    needs: check
    if: needs.check.outputs.paused != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write  # 画像をリポジトリにコミットするため

    steps:
      - uses: actions/checkout@v4

      - name: 日本語フォントのインストール
        run: sudo apt-get install -y fonts-noto-cjk -q

      - name: Python セットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: sns_scheduler/requirements.txt

      - name: 依存ライブラリのインストール
        run: pip install -r sns_scheduler/requirements.txt

      - name: Playwright Chromium インストール
        run: playwright install chromium --with-deps

      - name: 投稿生成スクリプト実行
        env:
          NOTION_TOKEN:                ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID:          ${{ secrets.NOTION_DATABASE_ID }}
          X_API_KEY:                   ${{ secrets.X_API_KEY }}
          X_API_KEY_SECRET:            ${{ secrets.X_API_KEY_SECRET }}
          X_ACCESS_TOKEN:              ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET:       ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          ANTHROPIC_API_KEY:           ${{ secrets.ANTHROPIC_API_KEY }}
          FAL_KEY:                     ${{ secrets.FAL_KEY }}
          LINE_CHANNEL_ACCESS_TOKEN:   ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID:                ${{ secrets.LINE_USER_ID }}
          GITHUB_REPOSITORY:           ${{ github.repository }}
        run: python sns_scheduler/daily_generator.py

      - name: 生成した画像をリポジトリにコミット
        run: |
          git config user.name  "SNS Scheduler Bot"
          git config user.email "bot@github.com"
          git add post-images/ 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Add post images $(date +%Y-%m-%d)"
          git push || true
