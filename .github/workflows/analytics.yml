name: Analytics - Fetch Post Metrics

on:
  schedule:
    # 毎日22:00 JST（13:00 UTC）に実行
    - cron: "0 13 * * *"
  workflow_dispatch:

jobs:
  analytics:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write  # フォロワー履歴のコミットのため

    steps:
      - uses: actions/checkout@v4

      - name: Python セットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: "**/requirements.txt"

      - name: レイアウト判定（sns_scheduler/ or ルート直下）
        run: |
          if [ -f sns_scheduler/requirements.txt ]; then
            echo "BASE=sns_scheduler/" >> "$GITHUB_ENV"
          else
            echo "BASE=" >> "$GITHUB_ENV"
          fi

      - name: 依存ライブラリのインストール
        run: pip install -r "${BASE}requirements.txt"

      - name: メトリクス取得・Notion更新
        env:
          NOTION_TOKEN:              ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID:        ${{ secrets.NOTION_DATABASE_ID }}
          X_API_KEY:                 ${{ secrets.X_API_KEY }}
          X_API_KEY_SECRET:          ${{ secrets.X_API_KEY_SECRET }}
          X_ACCESS_TOKEN:            ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET:     ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          THREADS_USER_ID:           ${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN:      ${{ secrets.THREADS_ACCESS_TOKEN }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID:              ${{ secrets.LINE_USER_ID }}
        run: python "${BASE}analytics.py"

      - name: フォロワー履歴をコミット
        run: |
          git config user.name  "SNS Scheduler Bot"
          git config user.email "bot@github.com"
          git pull --rebase || true
          git add "${BASE}follower_history.json" 2>/dev/null || true
          git diff --cached --quiet || git commit -m "Update follower history $(date +%Y-%m-%d)"
          git push || true
