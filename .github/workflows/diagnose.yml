name: Diagnose (エンゲージメント低下の原因調査)

# 「最近いいねが付きづらい」と感じたときに、実データで原因を切り分ける。
# Actionsタブ →「Diagnose (エンゲージメント低下の原因調査)」→ Run workflow で手動実行。
# 結果はログに表形式で出力される（Notionへの書き込みは行わない・読み取りのみ）。

on:
  workflow_dispatch:
    inputs:
      weeks:
        description: "分析対象の週数"
        required: false
        default: "12"
      min_age_days:
        description: "計測が育ちきったとみなす日数（これより新しい投稿は比較から除外）"
        required: false
        default: "3"

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Python セットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: "**/requirements.txt"

      - name: レイアウト判定（sns_scheduler/ or ルート直下）
        run: |
          if [ -f sns_scheduler/requirements.txt ]; then
            echo "BASE=sns_scheduler/" >> "$GITHUB_ENV"
          else
            echo "BASE=" >> "$GITHUB_ENV"
          fi

      - name: 依存ライブラリのインストール
        run: pip install -r "${BASE}requirements.txt"

      - name: 原因調査の実行
        env:
          NOTION_TOKEN:       ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID: ${{ secrets.NOTION_DATABASE_ID }}
        run: |
          python "${BASE}diagnose.py" \
            --weeks "${{ inputs.weeks }}" \
            --min-age-days "${{ inputs.min_age_days }}"
