name: Auto Poster

on:
  schedule:
    # 毎時00分に実行（JST 9:00〜23:00 = UTC 0:00〜14:00）
    - cron: "0 0-14 * * *"
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      paused: ${{ steps.flag.outputs.paused }}
    steps:
      - uses: actions/checkout@v4
      - id: flag
        name: 一時停止スイッチの確認
        run: |
          if [ -f .paused-post ]; then
            echo "paused=true" >> "$GITHUB_OUTPUT"
            echo "::notice::現在停止中です。再開するには Actions →「一時停止スイッチ」→ 再開する を実行してください"
          else
            echo "paused=false" >> "$GITHUB_OUTPUT"
          fi

  post:
    needs: check
    if: needs.check.outputs.paused != 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Python セットアップ
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: "**/requirements.txt"

      - name: レイアウト判定（sns_scheduler/ or ルート直下）
        run: |
          if [ -f sns_scheduler/requirements.txt ]; then
            echo "BASE=sns_scheduler/" >> "$GITHUB_ENV"
          else
            echo "BASE=" >> "$GITHUB_ENV"
          fi

      - name: 依存ライブラリのインストール
        run: pip install -r "${BASE}requirements.txt"

      - name: 自動投稿実行
        env:
          NOTION_TOKEN:                ${{ secrets.NOTION_TOKEN }}
          NOTION_DATABASE_ID:          ${{ secrets.NOTION_DATABASE_ID }}
          X_API_KEY:                   ${{ secrets.X_API_KEY }}
          X_API_KEY_SECRET:            ${{ secrets.X_API_KEY_SECRET }}
          X_ACCESS_TOKEN:              ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_TOKEN_SECRET:       ${{ secrets.X_ACCESS_TOKEN_SECRET }}
          THREADS_USER_ID:             ${{ secrets.THREADS_USER_ID }}
          THREADS_ACCESS_TOKEN:        ${{ secrets.THREADS_ACCESS_TOKEN }}
        run: python "${BASE}poster.py"
