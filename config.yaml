# ============================================================
#  SNSスケジューラー 設定ファイル
#  このファイルを編集するだけで、コードを触らずにカスタマイズできます。
# ============================================================

# ── 会社・ブランド情報 ────────────────────────────────────
company:
  name: 株式会社IMADOKI
  industry: AIマーケティング・SNS運用支援
  url: https://imadoki.co.jp

# ── ブランドカラー・ロゴ設定 ──────────────────────────────
# 生成される画像（インフォグラフィック）のデザインを自社カラーに変更できます。
# ※ 画像は白背景のため、白の上でも読める「濃いめの色」を指定してください。
branding:
  # グラフ・枠線・アクティブ要素のメインカラー
  primary_color: "#4f46e5"   # 例: "#0369a1"（濃い青）"#047857"（濃い緑）"#7c3aed"（濃い紫）

  # 数値・ハイライト・アクセントカラー
  accent_color: "#d97706"    # 例: "#ea580c"（濃いオレンジ）"#be185d"（濃いピンク）

  # ロゴ画像のURL（空白=会社名テキストを表示）
  # 例: "https://example.com/logo.png"
  logo_url: ""

  # 画像右下に表示する会社名（logo_url が空のときに使用）
  company_name: "株式会社IMADOKI"

# ── 投稿スタイル ──────────────────────────────────────────
content:
  # ターゲット読者（Claudeへの指示に使用）
  target_audience: 中小企業経営者・マーケター・20〜40代ビジネスパーソン

  # 投稿トーン（Claudeへの指示に使用）
  tone: 親しみやすい・専門用語なし・友達に話すような口調

  # 1日に生成する投稿数
  posts_per_day: 5

  # 文体
  # personal（既定）… 会社ではなく「中の人」個人の言葉として書く。伸びやすい
  # company        … 従来どおり、会社アカウントとしての文体
  voice: personal

  # 1回の投稿処理で配信する上限（Auto Posterは毎時実行）
  # 承認待ちをまとめて承認したときに数百件が一気に投稿されるのを防ぐ安全装置。
  # 3 なら1時間に最大3件＝1日最大45件のペースで、古いものから順に配信されます。
  # 0 にすると上限なし（非推奨）
  max_posts_per_run: 3

  # 「実績枠」として生成する本数（残りは検証枠）
  # 実績枠 = 数字が取れているフォーマットを再利用する / 検証枠 = 新しい型を試す
  # 5投稿なら 2 で「実績2・検証3」になる
  proven_posts: 2

  # 使用する投稿フォーマット（空 or 未記載 = 全10種を使う）
  # 選べる型: 箇条書き / 体験談ストーリー / 一問一答 / 会話・セリフ / 逆張り /
  #           ビフォーアフター / チェックリスト / 数字分解 / 失敗告白 / 連投スレッド
  # 例: 特定の型だけに絞りたいときは以下のように書く
  # formats:
  #   - 箇条書き
  #   - 体験談ストーリー
  #   - 逆張り
  formats: []

  # 編集長レビュー（2パス目のAI審査）。弱いフックや根拠のない数字を出稿前に自動修正。
  # API利用量が約2倍になるため、不要なら false に
  editor_review: true

  # 完全自動投稿モード
  # false（既定）… 生成した投稿は「承認待ち」で保存。承認した投稿だけ配信される
  # true          … 承認をスキップし、生成した投稿がそのまま予定時刻に自動投稿される
  # ※人のチェックが入らないため、クライアントの明示的な同意のうえで有効化すること
  auto_approve: false

  # AIアイキャッチ画像（fal.ai / FLUX schnell）。図解チャートが付かない投稿に
  # 文字なしの映える画像を補完する。要: GitHub Secretに FAL_KEY を登録。
  # 約$0.003/枚。使わないなら false のままでOK
  ai_eyecatch: false

  # 投稿文字数（文字）
  post_length_min: 200
  post_length_max: 400

  # ハッシュタグ数・絵文字数の上限
  hashtags_per_post: 1
  emoji_per_post: 2

  # Xの文字数上限（重み付き: 半角=1 / 全角=2）
  # 0 = 制限なし（X Premiumアカウント向け）
  # 無料アカウントの場合は 280 に設定してください（日本語約140文字）
  x_char_limit: 0

  # 禁止表現（Claudeへの指示）
  forbidden:
    - カタカナ専門用語の羅列
    - 上から目線の表現
    - 箇条書きで終わる投稿

# ── コンテンツトピック ────────────────────────────────────
topics:
  # メインテーマ（投稿内容のガイドとして使用）
  primary:
    - AI活用
    - SNS運用
    - マーケティング効率化

  # ベンチマークアカウント（業界の手本。この人たちの投稿も参考ソースに加える）
  # ※@は不要。最大3件まで使用
  # Actions →「Find Benchmarks (手本アカウント候補の抽出)」を実行すると、
  # 実データから候補が一覧で出るので、その中から3件選んでここに書いてください。
  benchmark_accounts: []

  # X（Twitter）での検索キーワード
  # トレンド検索・代替トレンド検索・手本アカウント探索の3つで使われます。
  # 集客が目的のため、ツール名だけでなく「悩みの言葉」を混ぜています。
  # 悩みの言葉で検索した方が、見込み客が実際に見ている投稿に当たります。
  keywords_x:
    - 生成AI 業務効率化
    - ChatGPT 活用
    - SNS運用 代行
    - Web集客
    - 中小企業 マーケティング

# ── RSSフィード ───────────────────────────────────────────
# 公開からこの時間数を超えた古い記事は投稿ネタに使わない
rss_max_age_hours: 48

rss_feeds:
  - https://rss.itmedia.co.jp/rss/2.0/aiplus.xml
  - https://www.publickey1.jp/atom.xml
  - https://b.hatena.ne.jp/hotentry/it.rss
  - https://blog.hubspot.com/marketing/rss.xml
  - https://buffer.com/resources/feed/

# ── 投稿スケジュール（JST）─────────────────────────────────
schedule:
  times:
    - "09:00"
    - "12:00"
    - "18:00"
    - "20:00"
    - "22:00"

  # 週次の特集テーマ（週ごとに順番に切り替わる）
  # 1週間を通して同じ切り口を別角度から積み上げることで、
  # 「このアカウントは何の専門家か」が伝わりフォロー率が上がります。
  # 空にすると従来どおり曜日フォーカスのみで動作します。
  weekly_themes:
    - AIツールを「実際に業務で使う」ための具体手順
    - SNS運用でやりがちな失敗と、その回避法
    - 少人数の会社が使える業務効率化のリアル
    - 数字で見るマーケティングの意思決定

  # 曜日別コンテンツフォーカス
  # フォロワーに「この曜日はこれが読める」という習慣を作るための設定。
  # 各曜日の方針がAIのテーマ選定に反映されます。
  weekly_calendar:
    mon: 週初めの仕事モードに合わせて、今週すぐ使える実践ノウハウを厚めに。保存されやすい手順・テクニック中心
    tue: データ・数字を切り口にした発見系。図解映えするテーマを優先
    wed: 週の中だるみに刺さる「あるある」の言語化・共感系。肩の力を抜いたトーン
    thu: 実践ノウハウ強化。月曜と違う角度のテクニック・ツール活用
    fri: 週末前のゆるい本音・失敗談。1週間の振り返りに絡めた学び
    sat: ライトなライフハック・意外な小ネタ。休日のながら読みに合う軽さ
    sun: 明日からの1週間に向けた前向きな行動提案・モチベートで締める

# ── レポート設定 ──────────────────────────────────────────
report:
  # 月間の表示回数（インプレッション）目標。週次・月次レポートに
  # 進捗ゲージとして表示されます。0にするとゲージ非表示
  monthly_goal_impressions: 50000

# ── Notionプロパティ名 ────────────────────────────────────
# Notionデータベースのプロパティ名を変更した場合はここを更新
notion:
  properties:
    text: 投稿文
    # Threads向けに書き分けた文面（テキストプロパティ）。未作成でも動作します
    threads_text: Threads用文面
    # X投稿直後に自動でぶら下げるセルフリプライ。未作成でも動作します
    reply_text: リプライ文面
    # 投稿タイプ（セレクトプロパティ）。タイプ別の実績学習に使用。未作成でも動作します
    post_type: 投稿タイプ
    # 投稿フォーマット（セレクトプロパティ）。どの「型」が伸びたかの学習に使用。
    # 未作成でも動作しますが、作ると型の良し悪しが自動で学習されます
    post_format: 投稿フォーマット
    # リプ周り用の返信先URL（URLプロパティ）。ここが入っている行は、
    # Threadsには出さずXで対象投稿への返信として配信されます。未作成でも動作します
    reply_to: 返信先URL
    datetime: 投稿日時
    platform: 媒体
    status: ステータス
    image_url: 画像URL
    # カルーセル（複数枚スライド）用。改行区切りで全画像URLを保存。未作成でも動作します
    image_urls: 画像URL一覧
    # 自動投稿後に記録される投稿ID
    tweet_id: X投稿ID
    threads_post_id: Threads投稿ID
    # 毎日22時に自動計測されるエンゲージメント指標
    likes: いいね数
    retweets: RT数
    impressions: インプレッション
    threads_likes: Threadsいいね数
    threads_views: Threads閲覧数
  status:
    pending: 承認待ち
    done: 投稿済
  platform:
    default: 両方

# ── リプ周り（他アカウントへの返信）────────────────────────
# 自分の投稿だけでは露出は増えません。伸びている投稿に価値のある返信をして、
# その読者に見つけてもらうための機能です。
# 文案はAIが作りますが、他社の投稿に絡むため必ず「承認待ち」で保存されます。
# （content.auto_approve が true でも、リプ周りだけは自動投稿されません）
reply_outreach:
  # true にすると Actions から「Reply Outreach」を実行できるようになります
  enabled: false

  # 1回あたりに作成する返信文案の数
  count: 5

  # 返信文案の最大文字数（長い返信は読まれません）
  max_chars: 120

  # 返信先を探すアカウント（未記載なら topics.benchmark_accounts を使用）
  # accounts:
  #   - example_account

  # 返信先を探すキーワード（未記載なら topics.keywords_x を使用）
  # keywords:
  #   - AI活用
