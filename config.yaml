# ============================================================
#  SNSスケジューラー 設定ファイル
#  このファイルを編集するだけで、コードを触らずにカスタマイズできます。
# ============================================================

# ── 会社・ブランド情報 ────────────────────────────────────
company:
  name: 株式会社IMADOKI
  industry: AIマーケティング・SNS運用支援
  url: https://imadoki.co.jp

# ── ブランドカラー・ロゴ設定 ──────────────────────────────
# 生成される画像（インフォグラフィック）のデザインを自社カラーに変更できます。
# ※ 画像は白背景のため、白の上でも読める「濃いめの色」を指定してください。
branding:
  # グラフ・枠線・アクティブ要素のメインカラー
  primary_color: "#4f46e5"   # 例: "#0369a1"（濃い青）"#047857"（濃い緑）"#7c3aed"（濃い紫）

  # 数値・ハイライト・アクセントカラー
  accent_color: "#d97706"    # 例: "#ea580c"（濃いオレンジ）"#be185d"（濃いピンク）

  # ロゴ画像のURL（空白=会社名テキストを表示）
  # 例: "https://example.com/logo.png"
  logo_url: ""

  # 画像右下に表示する会社名（logo_url が空のときに使用）
  company_name: "株式会社IMADOKI"

# ── 投稿スタイル ──────────────────────────────────────────
content:
  # ターゲット読者（Claudeへの指示に使用）
  target_audience: 中小企業経営者・マーケター・20〜40代ビジネスパーソン

  # 投稿トーン（Claudeへの指示に使用）
  tone: 親しみやすい・専門用語なし・友達に話すような口調

  # 1日に生成する投稿数
  posts_per_day: 5

  # 編集長レビュー（2パス目のAI審査）。弱いフックや根拠のない数字を出稿前に自動修正。
  # API利用量が約2倍になるため、不要なら false に
  editor_review: true

  # 投稿文字数（文字）
  post_length_min: 200
  post_length_max: 400

  # ハッシュタグ数・絵文字数の上限
  hashtags_per_post: 1
  emoji_per_post: 2

  # Xの文字数上限（重み付き: 半角=1 / 全角=2）
  # 0 = 制限なし（X Premiumアカウント向け）
  # 無料アカウントの場合は 280 に設定してください（日本語約140文字）
  x_char_limit: 0

  # 禁止表現（Claudeへの指示）
  forbidden:
    - カタカナ専門用語の羅列
    - 上から目線の表現
    - 箇条書きで終わる投稿

# ── コンテンツトピック ────────────────────────────────────
topics:
  # メインテーマ（投稿内容のガイドとして使用）
  primary:
    - AI活用
    - SNS運用
    - マーケティング効率化

  # X（Twitter）での検索キーワード
  keywords_x:
    - AI活用
    - ChatGPT
    - SNS運用
    - WEBマーケティング

# ── RSSフィード ───────────────────────────────────────────
# 公開からこの時間数を超えた古い記事は投稿ネタに使わない
rss_max_age_hours: 48

rss_feeds:
  - https://rss.itmedia.co.jp/rss/2.0/aiplus.xml
  - https://www.publickey1.jp/atom.xml
  - https://b.hatena.ne.jp/hotentry/it.rss
  - https://blog.hubspot.com/marketing/rss.xml
  - https://buffer.com/resources/feed/

# ── 投稿スケジュール（JST）─────────────────────────────────
schedule:
  times:
    - "09:00"
    - "12:00"
    - "18:00"
    - "20:00"
    - "22:00"

  # 曜日別コンテンツフォーカス
  # フォロワーに「この曜日はこれが読める」という習慣を作るための設定。
  # 各曜日の方針がAIのテーマ選定に反映されます。
  weekly_calendar:
    mon: 週初めの仕事モードに合わせて、今週すぐ使える実践ノウハウを厚めに。保存されやすい手順・テクニック中心
    tue: データ・数字を切り口にした発見系。図解映えするテーマを優先
    wed: 週の中だるみに刺さる「あるある」の言語化・共感系。肩の力を抜いたトーン
    thu: 実践ノウハウ強化。月曜と違う角度のテクニック・ツール活用
    fri: 週末前のゆるい本音・失敗談。1週間の振り返りに絡めた学び
    sat: ライトなライフハック・意外な小ネタ。休日のながら読みに合う軽さ
    sun: 明日からの1週間に向けた前向きな行動提案・モチベートで締める

# ── Notionプロパティ名 ────────────────────────────────────
# Notionデータベースのプロパティ名を変更した場合はここを更新
notion:
  properties:
    text: 投稿文
    # Threads向けに書き分けた文面（テキストプロパティ）。未作成でも動作します
    threads_text: Threads用文面
    # X投稿直後に自動でぶら下げるセルフリプライ。未作成でも動作します
    reply_text: リプライ文面
    # 投稿タイプ（セレクトプロパティ）。タイプ別の実績学習に使用。未作成でも動作します
    post_type: 投稿タイプ
    datetime: 投稿日時
    platform: 媒体
    status: ステータス
    image_url: 画像URL
    # カルーセル（複数枚スライド）用。改行区切りで全画像URLを保存。未作成でも動作します
    image_urls: 画像URL一覧
    # 自動投稿後に記録される投稿ID
    tweet_id: X投稿ID
    threads_post_id: Threads投稿ID
    # 毎日22時に自動計測されるエンゲージメント指標
    likes: いいね数
    retweets: RT数
    impressions: インプレッション
    threads_likes: Threadsいいね数
    threads_views: Threads閲覧数
  status:
    pending: 承認待ち
    done: 投稿済
  platform:
    default: 両方
